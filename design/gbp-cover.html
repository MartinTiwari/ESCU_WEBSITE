<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ESCU — Google Business Profile cover</title>
    <meta name="hz:slide-selector" content=".cover" />
    <meta name="hz:canvas-width" content="1024" />
    <meta name="hz:canvas-height" content="576" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap");

      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: #2a2a2a;
      }

      .cover {
        position: relative;
        width: 1024px;
        height: 576px;
        background: #0b1b28;
        overflow: hidden;
      }

      /* topographic contour field — same motif as the site hero */
      .contours {
        position: absolute;
        inset: 0;
      }

      /* warm summit glow behind the rings */
      .glow {
        position: absolute;
        right: -60px;
        top: -40px;
        width: 460px;
        height: 460px;
        border-radius: 50%;
        background: rgba(174, 216, 238, 0.16);
        filter: blur(90px);
      }

      /* keeps the left column legible over the rings */
      .scrim {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          to right,
          #0b1b28 34%,
          rgba(11, 27, 40, 0.72) 62%,
          rgba(11, 27, 40, 0.1) 100%
        );
      }

      .content {
        position: absolute;
        left: 68px;
        top: 62px;
        width: 620px;
      }

      .logo {
        width: 132px;
        height: auto;
        display: block;
        margin-bottom: 30px;
      }

      .eyebrow {
        font-family: "Space Mono", monospace;
        font-size: 12px;
        font-weight: 400;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: rgba(174, 216, 238, 0.85);
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 20px;
      }

      .eyebrow .rule {
        display: block;
        width: 30px;
        height: 1px;
        background: rgba(174, 216, 238, 0.5);
      }

      .wordmark {
        font-family: "Fraunces", Georgia, serif;
        font-weight: 500;
        font-size: 52px;
        line-height: 1.02;
        letter-spacing: -0.022em;
        color: #fbf9f4;
        margin-bottom: 22px;
      }

      .wordmark .thin {
        display: block;
        color: rgba(174, 216, 238, 0.92);
      }

      .rule-accent {
        width: 56px;
        height: 2px;
        background: #aed8ee;
        margin-bottom: 22px;
      }

      .categories {
        font-family: "Inter", sans-serif;
        font-weight: 400;
        font-size: 18px;
        line-height: 1.5;
        color: rgba(251, 249, 244, 0.62);
      }

      .meta {
        position: absolute;
        left: 68px;
        bottom: 48px;
        font-family: "Space Mono", monospace;
        font-size: 12px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: rgba(251, 249, 244, 0.42);
      }

      .meta .dot {
        display: inline-block;
        margin: 0 12px;
        color: rgba(174, 216, 238, 0.55);
      }
    </style>
  </head>
  <body>
    <div class="cover" data-canvas-width="1024" data-canvas-height="576">
      <div class="contours">
        <svg width="1024" height="576" viewBox="0 0 1024 576" fill="none">
          <g
            stroke="rgb(174,216,238)"
            stroke-width="1.1"
            fill="none"
            transform="translate(795 205)"
          >
            <path d="M0,-72 C34,-72 66,-46 66,-8 C66,26 40,58 4,60 C-32,62 -66,40 -66,2 C-66,-34 -34,-72 0,-72 Z" stroke-opacity="0.40" transform="scale(0.55)" />
            <path d="M0,-72 C34,-72 66,-46 66,-8 C66,26 40,58 4,60 C-32,62 -66,40 -66,2 C-66,-34 -34,-72 0,-72 Z" stroke-opacity="0.34" transform="scale(1.05)" />
            <path d="M0,-72 C34,-72 66,-46 66,-8 C66,26 40,58 4,60 C-32,62 -66,40 -66,2 C-66,-34 -34,-72 0,-72 Z" stroke-opacity="0.28" transform="scale(1.6)" />
            <path d="M0,-72 C34,-72 66,-46 66,-8 C66,26 40,58 4,60 C-32,62 -66,40 -66,2 C-66,-34 -34,-72 0,-72 Z" stroke-opacity="0.22" transform="scale(2.2)" />
            <path d="M0,-72 C34,-72 66,-46 66,-8 C66,26 40,58 4,60 C-32,62 -66,40 -66,2 C-66,-34 -34,-72 0,-72 Z" stroke-opacity="0.17" transform="scale(2.85)" />
            <path d="M0,-72 C34,-72 66,-46 66,-8 C66,26 40,58 4,60 C-32,62 -66,40 -66,2 C-66,-34 -34,-72 0,-72 Z" stroke-opacity="0.13" transform="scale(3.55)" />
            <path d="M0,-72 C34,-72 66,-46 66,-8 C66,26 40,58 4,60 C-32,62 -66,40 -66,2 C-66,-34 -34,-72 0,-72 Z" stroke-opacity="0.09" transform="scale(4.3)" />
          </g>
          <circle cx="795" cy="205" r="3" fill="rgb(205,234,252)" />
        </svg>
      </div>

      <div class="glow"></div>
      <div class="scrim"></div>

      <div class="content">
        <img class="logo" src="__LOGO_B64__" alt="ESCU" />

        <div class="eyebrow">
          <span class="rule"></span>
          <span>Est. BS 2058 &nbsp;·&nbsp; Kathmandu, Nepal</span>
        </div>

        <h1 class="wordmark">
          Everest Super
          <span class="thin">Chemical Udhyog</span>
        </h1>

        <div class="rule-accent"></div>

        <p class="categories">
          Water treatment &nbsp;·&nbsp; Swimming pool &nbsp;·&nbsp; Housekeeping chemicals
        </p>
      </div>

      <div class="meta">
        Manufacturer &amp; Supplier<span class="dot">·</span>Wholesale &amp; Bulk<span class="dot">·</span>Delivery Nationwide
      </div>
    </div>
  </body>
</html>
